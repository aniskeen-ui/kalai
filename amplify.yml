version: 1
backend:
  phases:
    build:
      commands:
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # The live shop is the "production" branch; every other branch builds the test site (orange TEST ribbon).
        - if [ "$AWS_BRANCH" = "production" ]; then VITE_KALAI_STAGE=prod npm run build; else VITE_KALAI_STAGE=test npm run build; fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
