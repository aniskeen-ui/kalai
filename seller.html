<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Sell your products on Kalai Art House.">
<title>Kalai Seller Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* Theme: remembers 🌙 / ☀️ choice per browser; otherwise follows the device setting. */
(function(){var t=null;try{t=localStorage.getItem('kalaiTheme')}catch(e){}if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
window.kalaiToggleTheme=function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),next=cur==='dark'?'light':'dark';r.setAttribute('data-theme',next);try{localStorage.setItem('kalaiTheme',next)}catch(e){}document.querySelectorAll('.theme-btn').forEach(function(b){b.textContent=next==='dark'?'☀️':'🌙';b.setAttribute('aria-label',next==='dark'?'Switch to light mode':'Switch to dark mode')})};
document.addEventListener('DOMContentLoaded',function(){var r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.querySelectorAll('.theme-btn').forEach(function(b){b.textContent=cur==='dark'?'☀️':'🌙';b.setAttribute('aria-label',cur==='dark'?'Switch to light mode':'Switch to dark mode');b.onclick=window.kalaiToggleTheme})});})();
</script>
<style>
/* Layout: operations desk — enquiry queue on the left, the selected enquiry's editor on the right */
:root{
  --bg:#f7f6f3; --surface:#ffffff; --sunk:#eeece6; --fg:#1d1b2b; --muted:#5f5b6e; --line:#dedbd2;
  --ink:#232046; --gold:#b0832b; --gold-soft:#f3e7cc; --kumkum:#a3242f; --ok:#2f7d4f; --on-ink:#f6f1e4;
  --display:"Marcellus",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121c;--surface:#1c1a28;--sunk:#232133;--fg:#efedf5;--muted:#a6a2b8;--line:#33304a;--ink:#0d0c16;--gold:#d9ad55;--gold-soft:#3a3020;--kumkum:#e0646e;--ok:#6cc08f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13121c;--surface:#1c1a28;--sunk:#232133;--fg:#efedf5;--muted:#a6a2b8;--line:#33304a;--ink:#0d0c16;--gold:#d9ad55;--gold-soft:#3a3020;--kumkum:#e0646e;--ok:#6cc08f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
header.top{background:var(--ink);color:var(--on-ink)}
header.top .in{display:flex;align-items:center;gap:16px;padding:14px max(16px,env(safe-area-inset-left,0px))}
header.top b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;margin-right:auto}
header.top button{background:transparent;color:var(--on-ink);border:1px solid #6d6596;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
main{padding:20px max(16px,env(safe-area-inset-left,0px)) 40px}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
.btn{border:0;border-radius:var(--r);padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:var(--on-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--gold);color:#1d1b2b}}
:root[data-theme="dark"] .btn{background:var(--gold);color:#1d1b2b}
.btn:disabled{opacity:.6;cursor:wait}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%}
label{font-size:13px;font-weight:600}
.field{display:grid;gap:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.login{max-width:380px;margin:40px auto;display:grid;gap:14px}
.err{color:var(--kumkum);font-size:14px;min-height:1em}
.muted{color:var(--muted);font-size:14px}
.desk{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar select{width:auto}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.count b{font-family:var(--mono)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--gold-soft)}
td.mono{font-family:var(--mono);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk)}
.pill.RECEIVED{background:var(--kumkum);color:#fff}
.pill.DELIVERED{background:var(--ok);color:#fff}
.pill.PRICE_SENT,.pill.PAID{background:var(--gold-soft)}
.detail{display:grid;gap:14px;position:sticky;top:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.links{display:flex;flex-wrap:wrap;gap:14px;font-size:14px}
.links a{color:var(--kumkum)}
.ok{color:var(--ok);font-size:14px;min-height:1em}
@media (max-width:900px){.desk{grid-template-columns:1fr}.detail{position:static}}
@media (max-width:480px){.two{grid-template-columns:1fr}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.theme-btn{background:transparent;border:1px solid #6d6596;border-radius:999px;color:var(--on-ink);font-size:16px;line-height:1;padding:6px 10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--fg);margin-left:4px}
fieldset.cost{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;display:grid;gap:10px;margin:0;min-width:0}
fieldset.cost legend{font-size:13px;font-weight:700;padding:0 6px}
fieldset.cost summary{font-size:13px;cursor:pointer;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
table.costs{font-size:13px;width:100%}
table.costs td,table.costs th{padding:5px 8px;white-space:normal}
table.costs input{padding:6px 8px}
table.costs td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.costs tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--gold-soft);border-radius:var(--r);padding:8px 10px;font-size:14px}
.marginline{font-size:13px}
.marginline.low{color:var(--kumkum)}
.warnline{font-size:12px;border-left:3px solid var(--gold);padding-left:8px}
@media (max-width:480px){.three{grid-template-columns:1fr}}
</style>
<style>
.alist{display:grid;gap:14px;max-width:820px;margin:0 auto}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.acard h2{font-size:20px}
.ameta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.stage{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--fg)}
.stage.NEEDED{background:var(--kumkum);color:#fff}
.stage.ORDERED,.stage.INVOICED{background:var(--gold-soft)}
.stage.PAID{background:var(--ok);color:#fff}
.brief{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:14px;margin:0}
.brief dt{color:var(--muted)} .brief dd{margin:0;overflow-wrap:anywhere}
.aform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.aform .wide{grid-column:1/-1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto 14px;max-width:820px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-pressed="true"]{background:var(--gold);color:#1d1b2b;border-color:var(--gold)}}
:root[data-theme="dark"] .tabs button[aria-pressed="true"]{background:var(--gold);color:#1d1b2b;border-color:var(--gold)}
.progress{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:10px;background:var(--sunk)}
.progress ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.progress li span:first-child{display:inline-block;width:1.1em;color:var(--muted)}
.progress li.done span:first-child{color:var(--ok);font-weight:700}
.progress.rework{border-color:var(--kumkum);border-width:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--kumkum);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
@media (max-width:560px){.aform{grid-template-columns:1fr}}
/* Compact: more works on screen */
body{font-size:13px;line-height:1.4}
header.top .in{padding-top:8px;padding-bottom:8px}
header.top b{font-size:18px}
header.top button,.theme-btn{padding:4px 10px;font-size:12px}
main{padding-top:12px}
.alist{gap:8px}
.acard{padding:10px 12px;gap:6px}
.acard h2{font-size:15px;font-family:var(--body);font-weight:600}
.ameta{font-size:11px;gap:6px}
.stage{font-size:11px;padding:1px 8px}
.brief{font-size:12px;gap:1px 10px}
.tabs{margin-bottom:8px;gap:6px}
.tabs button{padding:4px 11px;font-size:12px}
.progress{padding:6px 10px;gap:6px}
.progress ol{font-size:12px;gap:4px 12px}
.aform{gap:6px 8px}
label{font-size:11px}
.field{gap:2px}
input,select,textarea{padding:5px 8px;font-size:13px}
.btn{padding:6px 12px;font-size:12px}
.muted,.ok,.err,.linkbtn{font-size:12px}
main > p.muted{margin:0 auto 8px;max-width:820px}
.progress .ok:empty,.aform .ok:empty{display:none}
.progress > .btn,.progress .aform .btn{justify-self:start}
.progress .aform{grid-template-columns:repeat(3,minmax(0,1fr))}
.pricefix{font-size:12px}
.aform .field.wide{justify-items:start}
.aform[hidden]{display:none}
</style>
<style>
/* Seller portal */
.wrapc{max-width:900px;margin:0 auto;display:grid;gap:12px}
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.sbox h2{font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.two,.three{grid-template-columns:1fr}}
.authtabs{display:flex;gap:6px}
.authtabs button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.authtabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.lrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.lrow img{width:84px;height:84px;object-fit:cover;border-radius:4px;background:var(--sunk)}
.lrow h3{margin:0;font-size:15px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.st.APPROVED{background:var(--ok);color:#fff}.st.SUBMITTED{background:var(--gold-soft)}.st.REJECTED{background:var(--kumkum);color:#fff}.st.PAUSED{opacity:.7}
.calc{width:100%;border-collapse:collapse;font-size:13px}
.calc td{padding:4px 6px;border-bottom:1px solid var(--line)}
.calc td.n{text-align:right;font-family:var(--mono)}
.calc tr.t td{font-weight:700;border-top:2px solid var(--line)}
.calc tr.c td{color:var(--gold);font-weight:700}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:4px}
.thumbs button{position:absolute;top:2px;right:2px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;width:20px;height:20px;line-height:18px;cursor:pointer}
.radio{display:flex;gap:16px;flex-wrap:wrap}.radio label{display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px}.radio input{width:auto}
</style>
</head>
<body>
<header class="top"><div class="in"><b>KALAI · Seller portal</b><span id="who" class="muted" style="color:#cfc9e2"></span><button class="theme-btn" type="button" aria-label="Switch to dark mode">🌙</button><button id="signOutBtn" hidden>Sign out</button></div></header>
<main>
  <section id="loginView" class="wrapc" hidden>
    <div class="sbox" style="max-width:440px;margin:20px auto;width:100%">
      <h1 style="font-size:26px">Sell on Kalai Art House</h1>
      <p class="muted" style="margin:0">Craftspeople and artists: list your products on our website. We collect the payment, and you set your price.</p>
      <div class="authtabs"><button type="button" id="tSignIn" aria-pressed="true">Sign in</button><button type="button" id="tSignUp" aria-pressed="false">Create account</button></div>
      <form id="authForm" novalidate style="display:grid;gap:10px">
        <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email"></div>
        <div class="field"><label for="aPass">Password</label><input id="aPass" type="password" autocomplete="current-password"></div>
        <div class="field" id="aCodeBox" hidden><label for="aCode">Code from your email</label><input id="aCode" inputmode="numeric" autocomplete="one-time-code"></div>
        <div class="err" id="aErr" role="alert"></div>
        <button class="btn" type="submit" id="aBtn">Sign in</button>
        <button type="button" class="linkbtn" id="aForgot" style="justify-self:start">Forgot password?</button>
      </form>
    </div>
  </section>

  <section id="applyView" class="wrapc" hidden>
    <div class="sbox">
      <h2 id="applyTitle">Seller application</h2>
      <p class="muted" id="applyNote" style="margin:0">Tell us about your business. We check every seller before they can list products.</p>
      <form id="applyForm" novalidate style="display:grid;gap:10px">
        <div class="two"><div class="field"><label for="pBiz">Business / shop name</label><input id="pBiz"></div><div class="field"><label for="pName">Contact name</label><input id="pName" autocomplete="name"></div></div>
        <div class="two"><div class="field"><label for="pPhone">Mobile / WhatsApp</label><input id="pPhone" inputmode="tel" autocomplete="tel"></div><div class="field"><label for="pLic">Trade licence no. (if any)</label><input id="pLic"></div></div>
        <div class="two"><div class="field"><label for="pEmi">Emirate</label><select id="pEmi"><option value="">Choose…</option><option>Abu Dhabi</option><option>Dubai</option><option>Sharjah</option><option>Ajman</option><option>Umm Al Quwain</option><option>Ras Al Khaimah</option><option>Fujairah</option><option>Outside UAE</option></select></div><div class="field"><label for="pCat">What you sell (categories)</label><input id="pCat" placeholder="e.g. brass lamps, handloom, paintings"></div></div>
        <div class="field"><label for="pAddr">Pickup address (where Kalai can collect from)</label><textarea id="pAddr" rows="2"></textarea></div>
        <div class="field"><label for="pAbout">About your products</label><textarea id="pAbout" rows="3"></textarea></div>
        <fieldset class="sbox" style="padding:10px"><legend style="font-size:13px;font-weight:700">Where we pay you</legend>
          <div class="three"><div class="field"><label for="pBank">Bank</label><input id="pBank"></div><div class="field"><label for="pAcc">Account name</label><input id="pAcc"></div><div class="field"><label for="pIban">IBAN</label><input id="pIban" placeholder="AE07 0331 2345 6789 0123 456"></div></div>
        </fieldset>
        <div class="err" id="pErr" role="alert"></div>
        <button class="btn" type="submit" id="pBtn" style="justify-self:start">Send application</button>
      </form>
    </div>
  </section>

  <section id="statusView" class="wrapc" hidden><div class="sbox" id="statusBox"></div></section>

  <section id="deskView" class="wrapc" hidden>
    <div class="sbox" style="gap:6px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 id="dBiz" style="margin-right:auto"></h2><button class="btn ghost small" id="dProfile" type="button">My details</button><button class="btn" id="dNew" type="button">New listing</button></div>
      <div class="muted" id="dTerms" style="font-size:13px"></div>
    </div>
    <div id="editBox" hidden></div>
    <div id="lList" style="display:grid;gap:8px"></div>
  </section>
</main>
<script type="module" src="/src/seller.js"></script>
</body>
</html>
