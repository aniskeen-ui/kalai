# Pages are always checked for a new version (so a deploy shows at once); the built files under /assets have a new
# name on every change, so they can be kept by the browser for a long time.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, must-revalidate'
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'no-cache, must-revalidate'
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # The installed app's service worker and manifests: always checked for a new version.
  - pattern: '/sw.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, must-revalidate'
      - key: Service-Worker-Allowed
        value: '/'
  - pattern: '/app/**'
    headers:
      - key: Cache-Control
        value: 'no-cache'
